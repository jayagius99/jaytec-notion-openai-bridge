services:
  - type: web
    name: jaytec-notion-openai-bridge
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /mcp
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: CODEX_MODEL
        value: gpt-5.3-codex
      - key: MCP_AUTH_TOKEN
        sync: false
