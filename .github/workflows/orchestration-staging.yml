name: Orchestration Staging Tests

on:
  push:
    branches:
      - 'staging/**'
  pull_request:
    paths:
      - 'orchestration.py'
      - 'circuit_breaker.py'
      - 'worker_json.py'
      - 'specialist_adapters.py'
      - 'manus_policy.py'
      - 'jaytec_read.py'
      - 'meeting_bus.py'
      - 'test_meeting_bus.py'
      - 'jaytec_read_startup_selftest.py'
      - 'job_runtime.py'
      - 'job_runtime_schema.sql'
      - 'concurrency.py'
      - 'guardian.py'
      - 'guardian_runtime.py'
      - 'durable_tasks.py'
      - 'durable_tasks_runtime.py'
      - 'reliability_registry.py'
      - 'server.py'
      - 'reliable_server.py'
      - 'compat_server.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'test_compat_server.py'
      - 'test_compat_native_validation.py'
      - 'test_compat_transport_hardening.py'
      - 'test_dockerfile_packaging.py'
      - 'test_contract_equivalence.py'
      - 'test_orchestration.py'
      - 'test_circuit_breaker.py'
      - 'test_worker_policy_hardening.py'
      - 'test_worker_output_parsing.py'
      - 'test_gemini_transport_hardening.py'
      - 'test_jaytec_read.py'
      - 'test_specialist_timeout_hardening.py'
      - 'test_manus_policy.py'
      - 'test_manus_policy_integration_guard.py'
      - 'test_job_runtime.py'
      - 'test_concurrency.py'
      - 'test_guardian.py'
      - 'test_durable_tasks.py'
      - 'test_reliable_runtime_hardening.py'
      - 'test_server_candidate_probe.py'
      - 'staging_server.py'
      - 'staging_runtime_probe.py'
      - 'staging_adversarial_probe.py'
      - 'render.yaml'
      - 'BRIDGE_CONTRACT_V1.md'
      - 'idempotency_postgres.py'
      - 'test_idempotency_postgres.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile modules (including production entrypoint)
        run: |
          python -m py_compile \
            orchestration.py circuit_breaker.py worker_json.py specialist_adapters.py manus_policy.py jaytec_read.py meeting_bus.py jaytec_read_startup_selftest.py \
            job_runtime.py concurrency.py guardian.py guardian_runtime.py \
            durable_tasks.py durable_tasks_runtime.py reliability_registry.py \
            server.py reliable_server.py compat_server.py staging_server.py staging_runtime_probe.py staging_adversarial_probe.py \
            idempotency_postgres.py \
            test_orchestration.py test_circuit_breaker.py test_worker_policy_hardening.py \
            test_worker_output_parsing.py test_gemini_transport_hardening.py test_jaytec_read.py test_meeting_bus.py test_specialist_timeout_hardening.py test_manus_policy.py test_manus_policy_integration_guard.py \
            test_job_runtime.py test_concurrency.py test_guardian.py test_durable_tasks.py \
            test_reliable_runtime_hardening.py test_compat_server.py test_compat_native_validation.py \
            test_compat_transport_hardening.py test_idempotency_postgres.py test_dockerfile_packaging.py \
            test_contract_equivalence.py test_server_candidate_probe.py
      - name: Import guard (legacy server remains importable without secrets)
        run: python -c "import server; print('server_import_ok')"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Docker build smoke (production Dockerfile path)
        run: docker build -t jaytec-bridge-ci:smoke .
      - name: Docker container startup smoke (actual compatibility entrypoint; no provider calls)
        run: |
          set -euo pipefail
          cid=$(docker run -d \
            -p 127.0.0.1:18000:8000 \
            -e RUNTIME_MODE=staging_candidate \
            -e MCP_AUTH_TOKEN=test \
            -e OPENAI_API_KEY=test \
            -e CODEX_MODEL=gpt-5.3-codex \
            -e GEMINI_MODEL=google/gemini-3.1-pro-preview \
            -e DURABLE_WORKER_ENABLED=0 \
            -e GUARDIAN_LOOP_ENABLED=0 \
            jaytec-bridge-ci:smoke)
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              echo "compatibility container exited during startup"
              exit 1
            fi
            code=$(curl --connect-timeout 1 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/mcp || true)
            if [ "$code" != "000" ]; then
              echo "compatibility_container_startup_ok http_status=$code"
              exit 0
            fi
            sleep 1
          done
          echo "compatibility container did not become reachable"
          exit 1
