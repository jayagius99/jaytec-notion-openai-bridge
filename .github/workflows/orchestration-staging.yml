name: Orchestration Staging Tests

on:
  push:
    branches:
      - 'staging/**'
  pull_request:
    paths:
      - 'orchestration.py'
      - 'circuit_breaker.py'
      - 'worker_json.py'
      - 'test_orchestration.py'
      - 'test_circuit_breaker.py'
      - 'test_worker_policy_hardening.py'
      - 'test_worker_output_parsing.py'
      - 'staging_server.py'
      - 'staging_runtime_probe.py'
      - 'staging_adversarial_probe.py'
      - 'render.yaml'
      - 'BRIDGE_CONTRACT_V1.md'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run staging unit tests
        run: python -m unittest discover -v
      - name: Compile staging modules
        run: python -m py_compile orchestration.py circuit_breaker.py worker_json.py staging_server.py staging_runtime_probe.py staging_adversarial_probe.py test_orchestration.py test_circuit_breaker.py test_worker_policy_hardening.py test_worker_output_parsing.py
