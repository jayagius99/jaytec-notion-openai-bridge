name: Orchestration Staging Tests

on:
  push:
    branches:
      - 'staging/**'
  pull_request:
    paths:
      - 'orchestration.py'
      - 'circuit_breaker.py'
      - 'worker_json.py'
      - 'specialist_adapters.py'
      - 'server.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'test_dockerfile_packaging.py'
      - 'test_contract_equivalence.py'
      - 'test_orchestration.py'
      - 'test_circuit_breaker.py'
      - 'test_worker_policy_hardening.py'
      - 'test_worker_output_parsing.py'
      - 'test_server_candidate_probe.py'
      - 'staging_server.py'
      - 'staging_runtime_probe.py'
      - 'staging_adversarial_probe.py'
      - 'render.yaml'
      - 'BRIDGE_CONTRACT_V1.md'
      - 'idempotency_postgres.py'
      - 'test_idempotency_postgres.py'
      - 'manus_adapter.py'
      - 'manus_policy.py'
      - 'manus_governance.py'
      - 'manus_dispatch_contract.py'
      - 'relationship_policy.py'
      - 'participant_contracts.py'
      - 'MANUS_OPERATING_DIRECTIVE.md'
      - 'JAYTEC_RELATIONSHIP_CONTRACT.md'
      - 'JAYTEC_COMMAND_POLICY.md'
      - 'test_manus_adapter.py'
      - 'test_manus_policy.py'
      - 'test_manus_governance.py'
      - 'test_manus_dispatch_contract.py'
      - 'test_relationship_policy.py'
      - 'test_participant_contracts.py'
      - 'test_participant_prompt_injection.py'
      - 'test_manus_policy_integration_guard.py'
      - 'test_manus_adversarial_matrix.py'
      - 'test_provider_credit_topup.py'
      - 'staging_gemini_manus_governance_review.py'
      - 'staging_manus_governance_acceptance.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile modules (including production entrypoint)
        run: |
          python -m py_compile \
            orchestration.py circuit_breaker.py worker_json.py specialist_adapters.py \
            server.py staging_server.py staging_runtime_probe.py staging_adversarial_probe.py \
            staging_engineering_provider_probe.py staging_gemini_migration_review.py staging_gemini_manus_governance_review.py staging_manus_review_readback.py staging_manus_governance_acceptance.py manus_adapter.py \
            manus_policy.py manus_governance.py manus_dispatch_contract.py relationship_policy.py participant_contracts.py \
            idempotency_postgres.py \
            test_orchestration.py test_circuit_breaker.py test_worker_policy_hardening.py \
            test_worker_output_parsing.py test_idempotency_postgres.py test_dockerfile_packaging.py \
            test_contract_equivalence.py test_server_candidate_probe.py test_engineering_migration_guard.py \
            test_manus_adapter.py test_manus_policy.py test_manus_governance.py test_manus_dispatch_contract.py \
            test_relationship_policy.py test_participant_contracts.py test_participant_prompt_injection.py test_manus_policy_integration_guard.py \
            test_manus_adversarial_matrix.py test_provider_credit_topup.py test_manus_governance_acceptance.py test_manus_usability_eval.py test_gemini_manus_governance_review.py
      - name: Import guard (server.py must be importable without secrets)
        run: python -c "import server; print('server_import_ok')"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Docker build smoke (production Dockerfile path)
        run: docker build -t jaytec-bridge-ci:smoke .
      - name: Docker container startup smoke (staging_candidate only; no provider calls)
        run: |
          docker run --rm \
            -e RUNTIME_MODE=staging_candidate \
            -e MCP_AUTH_TOKEN=test \
            -e OPENAI_API_KEY=test \
            -e CODEX_MODEL=gpt-5.6-sol \
            -e GEMINI_MODEL=google/gemini-3.1-pro-preview \
            jaytec-bridge-ci:smoke \
            python -c "import os, importlib; os.environ['RUNTIME_MODE']='staging_candidate'; os.environ['MCP_AUTH_TOKEN']='test'; os.environ['OPENAI_API_KEY']='test'; os.environ['CODEX_MODEL']='gpt-5.6-sol'; os.environ['GEMINI_MODEL']='google/gemini-3.1-pro-preview'; import server; importlib.reload(server); server.create_mcp_app(); print('container_startup_ok')"
