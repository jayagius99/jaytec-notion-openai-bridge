services:
  - type: web
    name: jaytec-orchestration-staging
    runtime: python
    plan: free
    region: oregon
    branch: staging/execute-task-packet-v1
    buildCommand: pip install -r requirements.txt
    # Startup runs deterministic local validation only. Specialist/provider review probes are on-demand; locked or exhausted lanes never spend credits or slow every deploy.
    startCommand: python staging_adversarial_probe.py && python staging_server.py
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: JAYTEC_MCP_ALLOWED_HOSTS_JSON
        value: '["jaytec-orchestration-staging.onrender.com"]'
      - key: JAYTEC_MCP_ALLOWED_ORIGINS_JSON
        value: '[]'
      - key: OPENAI_API_KEY
        sync: false
      - key: ENGINEERING_MODEL
        value: gpt-5.6-sol
      - key: ENGINEERING_PROVIDER_MODE
        value: LOCKED_RESERVE
      - key: CODEX_MODEL
        value: gpt-5.6-sol
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_PROVIDER_MODE
        value: LOCKED_RESERVE
      - key: GEMINI_MODEL
        value: google/gemini-3.1-pro-preview
      - key: JAYTEC_READ_BOOTSTRAP_ENABLED
        value: "0"
      - key: JAYTEC_G1_INDEPENDENT_REVIEW_SERVER_ONESHOT
        value: "0"
      - key: JAYTEC_GOD_PROJECT_REVIEW_ENABLED
        value: "0"
      - key: JAYTEC_DEEPSEEK_SECURITY_REVIEW_ENABLED
        value: "0"
      - key: JAYTEC_DEEPSEEK_TRANSPORT_MATRIX_ENABLED
        value: "0"
      - key: JAYTEC_DEEPSEEK_ROUTE_VISIBILITY_ENABLED
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: JAYTEC_STAGING_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: JAYTEC_AUTORECOVERY_ENABLED
        value: "1"
      - key: JAYTEC_AUTORECOVERY_SCHEMA_BOOTSTRAP
        value: "0"
      - key: JAYTEC_AUTORECOVERY_SCHEMA_READY
        value: "1"
      - key: JAYTEC_AUTORECOVERY_CALLABLE_ROUTES
        value: '["jaytec-manus-lite-v1"]'
      - key: JAYTEC_AUTORECOVERY_CHECKPOINT_VERIFIER
        value: github_exact_head_v1
      - key: JAYTEC_AUTORECOVERY_HEARTBEAT_MODE
        value: fenced_postgres_v1
      - key: JAYTEC_AUTORECOVERY_NOTIFICATION_MODE
        value: event_log_v1
      - key: JAYTEC_AUTORECOVERY_RUNTIME_COMPONENTS
        value: manus_lite_v1
      - key: JAYTEC_PROTOCOL_DATABASE_URL
        sync: false
