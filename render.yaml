services:
  - type: web
    name: jaytec-orchestration-staging
    runtime: python
    plan: free
    region: oregon
    branch: staging/execute-task-packet-v1
    buildCommand: pip install -r requirements.txt
    startCommand: python staging_server.py
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: CODEX_MODEL
        value: gpt-5.3-codex
      - key: GEMINI_MODEL
        value: google/gemini-3.1-pro-preview
