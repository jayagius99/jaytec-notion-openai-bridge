plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jaytec.chat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jaytec.chat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
