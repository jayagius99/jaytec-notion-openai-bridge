services:
  - type: web
    name: jaytec-orchestration-staging
    runtime: python
    plan: free
    region: oregon
    branch: staging/execute-task-packet-v1
    buildCommand: pip install -r requirements.txt
    # Provider probes are validation-only. Codex 429 and Manus door failure must not prevent staging boot.
    startCommand: python staging_adversarial_probe.py && (python staging_codex_429_diagnostic.py || true) && (python staging_manus_door_probe.py || true) && python staging_server.py
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CODEX_MODEL
        value: gpt-5.3-codex
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: google/gemini-3.1-pro-preview
      - key: MANUS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: JAYTEC_STAGING_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
