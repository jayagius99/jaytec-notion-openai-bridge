      - 'dispatch_authority_boundary.py'
      - 'test_dispatch_authority_boundary.py'
      - 'startup_probe_guard.py'
      - 'test_startup_probe_guard.py'
      - 'test_startup_provider_safety.py'
      - 'staging_codex_429_diagnostic.py'
      - 'staging_engineering_provider_probe.py'
      - 'autorecovery_supervisor.py'
      - 'autorecovery_runtime.py'
      - 'autorecovery_loop.py'
      - 'autorecovery_components.py'
      - 'autorecovery_watch_ingress.py'
      - 'github_watch_oidc.py'
      - 'test_autorecovery_components.py'
      - 'test_autorecovery_watch_ingress.py'
      - 'test_github_watch_oidc.py'
      - 'test_watch_auth_isolation.py'
      - 'test_watch_controller_redirect.py'
      - 'test_staging_startup_nonblocking.py'
      - 'AUTORECOVERY_RUNBOOK.md'
      - 'test_autorecovery_supervisor.py'
      - 'test_autorecovery_runtime.py'
      - 'test_autorecovery_loop.py'
      - 'test_jaytec_watch_command_policy.py'
      - 'jaytec_protocol_portal.py'
      - 'test_jaytec_protocol_portal.py'
      - 'forge_cognition.py'
      - 'proving_grounds.py'
      - 'test_proving_grounds.py'
      - 'forge_cognition_engine.py'
      - 'forge_cognition_benchmark.py'
      - 'test_forge_cognition.py'
      - 'test_forge_cognition_engine.py'
      - 'forge_strategic_drives.py'
      - 'forge_strategy_engine.py'
      - 'forge_strategy_benchmark.py'
      - 'test_forge_strategic_drives.py'
      - 'test_forge_strategy_engine.py'
