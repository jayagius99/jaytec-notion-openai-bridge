name: Build JAYTEC Chat APK

on:
  push:
    branches:
      - android/jaytec-chat-apk-v1
    paths:
      - 'mobile/jaytec-chat/**'
      - '.github/workflows/build-jaytec-chat-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$RUNNER_TEMP/cmdtools"
          curl -fsSL --retry 3             https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip             -o "$RUNNER_TEMP/cmdtools.zip"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mobile/jaytec-chat
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: cp mobile/jaytec-chat/app/build/outputs/apk/debug/app-debug.apk JAYTEC-Chat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAYTEC-Chat-APK
          path: JAYTEC-Chat.apk
          if-no-files-found: error
          retention-days: 14
