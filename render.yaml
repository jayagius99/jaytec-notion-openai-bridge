services:
  - type: web
    name: jaytec-orchestration-staging
    runtime: python
    plan: free
    region: oregon
    branch: staging/execute-task-packet-v1
    buildCommand: pip install -r requirements.txt
    # Startup runs deterministic local validation only. Specialist/provider review probes are on-demand; locked or exhausted lanes never spend credits or slow every deploy.
    startCommand: python staging_adversarial_probe.py && python staging_independent_g1_review.py && python staging_gemini_manus_governance_review.py && python staging_manus_governance_acceptance.py && python staging_server.py
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENGINEERING_MODEL
        value: gpt-5.6-sol
      - key: ENGINEERING_PROVIDER_MODE
        value: LOCKED_RESERVE
      - key: CODEX_MODEL
        value: gpt-5.6-sol
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: google/gemini-3.1-pro-preview
      - key: MANUS_API_KEY
        sync: false
      - key: JAYTEC_MANUS_REVIEW_TASK_ID
        sync: false
      - key: JAYTEC_MANUS_PROJECT_ID
        value: cqVx5Cdb55edTrDRVfgCNH
      - key: RUN_LIVE_GEMINI_MANUS_GOVERNANCE_REVIEW
        value: "0"
      - key: RUN_LIVE_MANUS_GOVERNANCE_ACCEPTANCE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: JAYTEC_STAGING_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
