services:
  - type: web
    name: jaytec-orchestration-staging
    runtime: python
    plan: free
    region: oregon
    branch: staging/execute-task-packet-v1
    buildCommand: pip install -r requirements.txt
    # Validation/review probes fail closed without preventing staging boot. The paid OpenAI/Codex engineering door is LOCKED_RESERVE and no provider probe runs while locked.
    startCommand: python staging_adversarial_probe.py && (python staging_manus_door_probe.py || true) && (python staging_gemini_migration_review.py || true) && (python staging_manus_review_readback.py || true) && python staging_server.py
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENGINEERING_MODEL
        value: gpt-5.6-sol
      - key: ENGINEERING_PROVIDER_MODE
        value: LOCKED_RESERVE
      - key: CODEX_MODEL
        value: gpt-5.6-sol
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: google/gemini-3.1-pro-preview
      - key: MANUS_API_KEY
        sync: false
      - key: JAYTEC_MANUS_REVIEW_TASK_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
      - key: JAYTEC_STAGING_DATABASE_URL
        fromDatabase:
          name: jaytec-orchestration-state
          property: connectionString
