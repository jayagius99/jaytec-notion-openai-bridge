permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Compile modules (including production entrypoint)
        run: |
          python -m py_compile \
            orchestration.py circuit_breaker.py worker_json.py specialist_adapters.py deepseek_reviewer.py provider_endpoints.py http_security.py auth_security.py dispatch_authority_boundary.py test_deepseek_reviewer.py test_auth_security.py test_dispatch_authority_boundary.py \
            server.py staging_server.py staging_runtime_probe.py staging_adversarial_probe.py staging_independent_g1_review.py test_staging_independent_g1_review.py startup_probe_guard.py staging_codex_429_diagnostic.py test_startup_probe_guard.py test_startup_provider_safety.py \
            staging_engineering_provider_probe.py staging_gemini_migration_review.py staging_gemini_manus_governance_review.py staging_manus_review_readback.py staging_manus_governance_acceptance.py staging_manus_usability_eval.py manus_adapter.py \
            manus_policy.py manus_governance.py manus_dispatch_contract.py manus_runtime.py relationship_policy.py participant_contracts.py \
            idempotency_postgres.py \
            test_orchestration.py test_circuit_breaker.py test_worker_policy_hardening.py \
            test_worker_output_parsing.py test_idempotency_postgres.py test_dockerfile_packaging.py \
            test_contract_equivalence.py test_server_candidate_probe.py test_engineering_migration_guard.py \
            autorecovery_supervisor.py autorecovery_runtime.py autorecovery_loop.py autorecovery_components.py autorecovery_watch_ingress.py github_watch_oidc.py jaytec_protocol_portal.py forge_cognition.py forge_cognition_engine.py forge_cognition_benchmark.py forge_strategic_drives.py forge_strategy_engine.py forge_strategy_benchmark.py forge_genesis_binding.py proving_grounds.py test_proving_grounds.py \
            test_autorecovery_supervisor.py test_autorecovery_runtime.py test_autorecovery_loop.py test_autorecovery_components.py test_autorecovery_watch_ingress.py test_github_watch_oidc.py test_watch_auth_isolation.py test_watch_controller_redirect.py test_staging_startup_nonblocking.py test_jaytec_watch_command_policy.py test_jaytec_protocol_portal.py test_forge_cognition.py test_forge_cognition_engine.py test_forge_strategic_drives.py test_forge_strategy_engine.py test_forge_strategic_adversarial.py test_forge_genesis_strategic_policy.py test_forge_genesis_binding.py \
            test_manus_adapter.py test_manus_policy.py test_manus_governance.py test_manus_dispatch_contract.py \
            test_relationship_policy.py test_participant_contracts.py test_participant_prompt_injection.py test_manus_policy_integration_guard.py test_manus_runtime.py \
            test_manus_adversarial_matrix.py test_provider_credit_topup.py test_manus_governance_acceptance.py test_manus_usability_eval.py test_gemini_manus_governance_review.py
      - name: Import guard (server.py must be importable without secrets)
        run: python -c "import server; print('server_import_ok')"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Benchmark Forge cognition working packet
        run: python forge_cognition_benchmark.py
      - name: Benchmark Forge deterministic strategic selection
        run: python forge_strategy_benchmark.py
      - name: Docker build smoke (production Dockerfile path)
        run: docker build -t jaytec-bridge-ci:smoke .
      - name: Docker container startup smoke (staging_candidate only; no provider calls)
        run: |
          docker run --rm \
            -e RUNTIME_MODE=staging_candidate \
            -e MCP_AUTH_TOKEN=test \
            -e OPENAI_API_KEY=test \
            -e CODEX_MODEL=gpt-5.6-sol \
            -e GEMINI_MODEL=google/gemini-3.1-pro-preview \
            jaytec-bridge-ci:smoke \
            python -c "import os, importlib; os.environ['RUNTIME_MODE']='staging_candidate'; os.environ['MCP_AUTH_TOKEN']='test'; os.environ['OPENAI_API_KEY']='test'; os.environ['CODEX_MODEL']='gpt-5.6-sol'; os.environ['GEMINI_MODEL']='google/gemini-3.1-pro-preview'; import server; importlib.reload(server); server.create_mcp_app(); print('container_startup_ok')"

      - name: Real staging_server HTTP entrypoint smoke (locked providers)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          set +e
          timeout 15s env \
            PYTHONUNBUFFERED=1 \
            PORT=18080 \
            MCP_AUTH_TOKEN=test \
            JAYTEC_MCP_ALLOWED_HOSTS_JSON='["127.0.0.1","localhost","testserver"]' \
            JAYTEC_MCP_ALLOWED_ORIGINS_JSON='[]' \
            ENGINEERING_PROVIDER_MODE=LOCKED_RESERVE \
            OPENROUTER_PROVIDER_MODE=LOCKED_RESERVE \
            JAYTEC_READ_BOOTSTRAP_ENABLED=0 \
            JAYTEC_G1_INDEPENDENT_REVIEW_SERVER_ONESHOT=0 \
            JAYTEC_GOD_PROJECT_REVIEW_ENABLED=0 \
            JAYTEC_DEEPSEEK_SECURITY_REVIEW_ENABLED=0 \
            JAYTEC_DEEPSEEK_TRANSPORT_MATRIX_ENABLED=0 \
            JAYTEC_DEEPSEEK_ROUTE_VISIBILITY_ENABLED=0 \
            JAYTEC_AUTORECOVERY_ENABLED=0 \
            JAYTEC_AUTORECOVERY_SCHEMA_READY=0 \
            python staging_server.py >"$log_file" 2>&1
          rc=$?
          set -e
          cat "$log_file"
          if [ "$rc" -ne 124 ]; then
            echo "staging_server exited before bounded smoke timeout: rc=$rc" >&2
            exit "$rc"
          fi
          grep -Eq 'Application startup complete|Uvicorn running|Started server process' "$log_file"
          echo "staging_server_entrypoint_smoke_ok"
