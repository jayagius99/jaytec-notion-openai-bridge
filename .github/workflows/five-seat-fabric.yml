name: Five-Seat Fabric CI

on:
  pull_request:
    paths:
      - '.github/workflows/five-seat-fabric.yml'
      - 'five_seat_*.py'
      - 'five_seat_schema.sql'
      - 'test_five_seat_*.py'
      - 'config/five_seat_fabric_v1.json'
      - 'docs/FIVE_SEAT_CONTINUOUS_FABRIC_V1.md'
      - 'concurrency.py'
      - 'job_runtime.py'
      - 'job_runtime_schema.sql'
      - 'test_concurrency.py'
      - 'test_job_runtime.py'
  push:
    branches:
      - 'infra/five-seat-worker-fabric-v1'
    paths:
      - '.github/workflows/five-seat-fabric.yml'
      - 'five_seat_*.py'
      - 'five_seat_schema.sql'
      - 'test_five_seat_*.py'
      - 'config/five_seat_fabric_v1.json'
      - 'docs/FIVE_SEAT_CONTINUOUS_FABRIC_V1.md'
      - 'concurrency.py'
      - 'job_runtime.py'
      - 'job_runtime_schema.sql'
      - 'test_concurrency.py'
      - 'test_job_runtime.py'

concurrency:
  group: five-seat-fabric-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  five-seat-unit-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jaytec
          POSTGRES_PASSWORD: jaytec_test
          POSTGRES_DB: jaytec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaytec -d jaytec_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://jaytec:jaytec_test@127.0.0.1:5432/jaytec_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile five-seat and inherited runtime
        run: |
          python -m py_compile             five_seat_adapters.py five_seat_authority.py five_seat_guardian.py five_seat_queue.py             five_seat_remedies.py five_seat_runtime.py five_seat_signals.py             five_seat_watch.py five_seat_worker.py five_seat_canary_server.py             concurrency.py job_runtime.py             test_five_seat_contract.py test_five_seat_runtime.py             test_five_seat_watch.py test_five_seat_continuous.py             test_five_seat_remedies.py test_concurrency.py test_job_runtime.py

      - name: Apply existing durable schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f job_runtime_schema.sql

      - name: Apply five-seat additive migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f five_seat_schema.sql

      - name: Reapply five-seat migration for idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f five_seat_schema.sql

      - name: Initialize fabric authority test snapshot
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "update jaytec_fabric_authority_state set current_shared_state_version=1, authority_epoch=authority_epoch+1, fence_token=fence_token+1, updated_by='FIVE_SEAT_CI', updated_at=now() where authority_id='FABRIC'"

      - name: Verify exact five seats and singleton WATCH row
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from jaytec_worker_seats")" = "5"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from jaytec_watch_leader where controller_id='WATCH'")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from jaytec_worker_seats where seat_id='WORKER-SEAT-6'")" = "0"

      - name: Prove legacy scheduler cannot bypass seat registry
        run: |
          python - <<'PY'
          import os, psycopg2
          from concurrency import PostgresConcurrencyScheduler
          from five_seat_runtime import PostgresFiveSeatScheduler
          url=os.environ["DATABASE_URL"]
          legacy_id="ci-legacy-isolation"
          fabric_id="ci-fabric-isolation"
          try:
              with psycopg2.connect(url) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          """INSERT INTO jaytec_jobs(
                          job_id,project_id,task_id,assignment_type,objective,status,
                          priority,source_shared_state_version,concurrency_class,
                          mutation_scope,read_scope,dependencies,resource_scope,fabric_state
                          ) VALUES
                          (%s,'CI','legacy','LEGACY_TEST','legacy','QUEUED',2,1,'A','[]','[]','[]','{}',NULL),
                          (%s,'CI','fabric','FIVE_SEAT_FABRIC','fabric','QUEUED',1,1,'B','["scope/fabric"]','[]','[]','{}','QUEUED')""",
                          (legacy_id,fabric_id),
                      )
                      cur.execute(
                          """INSERT INTO jaytec_fabric_envelopes(
                          job_id,envelope_hash,idempotency_key,worker_kind,
                          required_capabilities,authority_class,payload
                          ) VALUES (%s,'hash','idem-ci-isolation','TEST','["test.run"]',
                          'SCOPED_MUTATION','{}')""",
                          (fabric_id,),
                      )
              legacy=PostgresConcurrencyScheduler(url,max_parallel=4)
              first=legacy.claim_next(owner="legacy-ci",execution_room_id="legacy-room",lease_seconds=60)
              assert first and first["job_id"]==legacy_id, first
              with psycopg2.connect(url) as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT status,seat_id FROM jaytec_jobs WHERE job_id=%s",(fabric_id,))
                      assert cur.fetchone()==("QUEUED",None)
              fabric=PostgresFiveSeatScheduler(url)
              second=fabric.claim_next(
                  owner="fabric-ci",execution_room_id="fabric-room",lease_seconds=60,
                  supported_worker_kinds={"TEST"},capabilities={"test.run"},
              )
              assert second and second["job_id"]==fabric_id, second
              assert second["seat_id"].startswith("WORKER-SEAT-")
              print("legacy_scheduler_isolation=PASS", second["seat_id"])
          finally:
              with psycopg2.connect(url) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          """UPDATE jaytec_worker_seats SET state='FREE',current_job_id=NULL,
                          worker_id=NULL,lease_owner=NULL,lease_expires_at=NULL
                          WHERE current_job_id=%s""",(fabric_id,)
                      )
                      cur.execute("DELETE FROM jaytec_fabric_envelopes WHERE job_id=%s",(fabric_id,))
                      cur.execute("DELETE FROM jaytec_jobs WHERE job_id IN (%s,%s)",(legacy_id,fabric_id))
          PY

      - name: Run five-seat tests
        run: python -m unittest discover -v -p 'test_five_seat*.py'

      - name: Run inherited concurrency and fence regression tests
        run: python -m unittest -v test_concurrency.py test_job_runtime.py
